// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Centralized security-pinned versions to address Dependabot CVEs.
// Version constants live in gradle.properties (loaded before script parsing).
// Bump nettyVersion / protobufVersion there to roll out a fix across both classpaths.

def nettyV = project.findProperty('nettyVersion') ?: '4.1.139.Final'
def protobufV = project.findProperty('protobufVersion') ?: '3.25.5'

def nettyModules = [
    'netty-common',
    'netty-buffer',
    'netty-transport',
    'netty-transport-native-unix-common',
    'netty-resolver',
    'netty-codec',
    'netty-codec-http',
    'netty-codec-http2',
    'netty-codec-socks',
    'netty-handler',
    'netty-handler-proxy',
]

def nettyPins = nettyModules.collect { "io.netty:${it}:${nettyV}" }

// Build-time only (Gradle/AGP classpath). Not shipped in APK.
def buildClasspathPins = [
    'org.bouncycastle:bcprov-jdk18on:1.86',
    'org.bouncycastle:bcpkix-jdk18on:1.86',
    'org.bouncycastle:bcutil-jdk18on:1.86',
    'org.jdom:jdom2:2.0.6.1',
    'org.bitbucket.b_c:jose4j:0.9.6',
    'org.apache.commons:commons-compress:1.27.1',
    'org.apache.commons:commons-lang3:3.18.0',
    'com.google.guava:guava:33.7.2-jre',
] + nettyPins

// Build/test-only: AGP's unified test platform pulls older Guava.
def testPlatformPins = [
    'com.google.guava:guava:33.7.2-jre',
]

// Build/test-only tool configurations created by Kotlin, AGP and plugin
// modules. Scoped by configuration name so nothing shipped in the APK changes.
def bouncyCastleV = '1.86'
def toolConfigPins = [
    // Kotlin Gradle plugin's internal BouncyCastle classpath.
    kotlinBouncyCastle: [
        "org.bouncycastle:bcprov-jdk18on:${bouncyCastleV}",
        "org.bouncycastle:bcpkix-jdk18on:${bouncyCastleV}",
        "org.bouncycastle:bcutil-jdk18on:${bouncyCastleV}",
        "org.bouncycastle:bcpg-jdk18on:${bouncyCastleV}",
    ],
    // Kotlin's Swift-export tooling (iOS only; never run for Android).
    swiftExport: [
        'io.opentelemetry:opentelemetry-api:1.67.0',
    ],
    // Annotation processors (e.g. Room compiler in @capacitor-community/sqlite).
    AnnotationProcessor: [
        'com.google.guava:guava:33.7.2-jre',
    ],
    // Plugin modules' own unit-test classpaths (e.g. capacitor-android).
    UnitTest: [
        'org.json:json:20260719',
    ],
]

// Minimum versions applied through a component metadata rule in allprojects
// below. These libraries are only used by build tooling (lint etc.) and are
// not in the app's runtime classpath.
def toolingMinPins = [
    'org.bouncycastle:bcprov-jdk18on'        : bouncyCastleV,
    'org.bouncycastle:bcpkix-jdk18on'        : bouncyCastleV,
    'org.bouncycastle:bcutil-jdk18on'        : bouncyCastleV,
    'org.apache.commons:commons-compress'    : '1.27.1',
    'org.apache.commons:commons-lang3'       : '3.18.0',
    'org.apache.httpcomponents:httpclient'   : '4.5.14',
]
// Guava is only raised for Android lint tooling (com.android.tools.*), so the
// -android Guava flavour used by app libraries is never swapped for -jre.
def lintToolingPins = toolingMinPins + [
    'com.google.guava:guava'                 : '33.7.2-jre',
]

// Runtime (shipped in APK). Forced via Firebase Messaging transitives.
def runtimePins = [
    "com.google.protobuf:protobuf-java:${protobufV}",
    "com.google.protobuf:protobuf-javalite:${protobufV}",
    "com.google.protobuf:protobuf-kotlin:${protobufV}",
] + nettyPins

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    // Lock the build classpath itself, so the AGP/plugin versions that build
    // this app are reproducible too. Regenerate together with the module
    // lockfiles via: ./gradlew dependencies --write-locks
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // Direct classpath pins for Dependabot. Top-level entries ensure the
        // submitted dependency graph reports patched versions, not the older
        // transitives pulled by AGP/google-services. Keep in sync with
        // buildClasspathPins below.
        classpath 'org.bouncycastle:bcprov-jdk18on:1.86'
        classpath 'org.bouncycastle:bcpkix-jdk18on:1.86'
        classpath 'org.bouncycastle:bcutil-jdk18on:1.86'
        classpath 'org.jdom:jdom2:2.0.6.1'
        classpath 'org.bitbucket.b_c:jose4j:0.9.6'
        classpath 'org.apache.commons:commons-compress:1.27.1'
        classpath 'org.apache.commons:commons-lang3:3.18.0'
        classpath 'com.google.guava:guava:33.7.2-jre'
        classpath 'io.netty:netty-common:4.1.139.Final'
        classpath 'io.netty:netty-buffer:4.1.139.Final'
        classpath 'io.netty:netty-transport:4.1.139.Final'
        classpath 'io.netty:netty-transport-native-unix-common:4.1.139.Final'
        classpath 'io.netty:netty-resolver:4.1.139.Final'
        classpath 'io.netty:netty-codec:4.1.139.Final'
        classpath 'io.netty:netty-codec-http:4.1.139.Final'
        classpath 'io.netty:netty-codec-http2:4.1.139.Final'
        classpath 'io.netty:netty-codec-socks:4.1.139.Final'
        classpath 'io.netty:netty-handler:4.1.139.Final'
        classpath 'io.netty:netty-handler-proxy:4.1.139.Final'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Dependency locking: makes resolved versions reproducible and auditable so a
    // compromised/re-published upstream version cannot silently enter a build.
    //
    // Two mechanisms are in play, and BOTH must be refreshed whenever a
    // dependency or plugin version changes (including Dependabot bumps —
    // otherwise the build fails with a verification error):
    //
    //   ./gradlew dependencies --write-locks                     # *.lockfile
    //   ./gradlew --write-verification-metadata sha256 \
    //       :app:dependencies :capacitor-cordova-android-plugins:dependencies
    //                                          # gradle/verification-metadata.xml
    //
    // Both commands need JDK 17+ (the wrapper fails on JDK 11).
    // To relax enforcement temporarily, run with --dependency-verification=lenient.
    dependencyLocking {
        lockAllConfigurations()
    }

    configurations.configureEach {
        resolutionStrategy {
            runtimePins.each { force it }
            if (name.startsWith('_internal-unified-test-platform')) {
                testPlatformPins.each { force it }
            }
            def cfgName = name
            toolConfigPins.each { key, pins ->
                if (cfgName.contains(key)) pins.each { force it }
            }
        }
    }

    // AGP resolves Android lint tooling (used by extract*Annotations) through
    // detached configurations, which configurations.configureEach can't reach.
    // A component metadata rule applies to every resolution, so raise the
    // versions those components request. Build-time only.
    dependencies.components.all { details ->
        def pins = details.id.group.startsWith('com.android.tools') ? lintToolingPins : toolingMinPins
        details.allVariants {
            withDependencies { deps ->
                deps.each { dep ->
                    def pinned = pins["${dep.group}:${dep.name}"]
                    if (pinned) dep.version { require pinned }
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
